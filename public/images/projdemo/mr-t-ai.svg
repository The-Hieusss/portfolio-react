<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Mr. T AI</title>
  <desc id="desc">A bold T whose stem is a highway, with an AI sparkle beside it</desc>
  <circle cx="32" cy="32" r="30" fill="#0f172a"/>
  <!-- T crossbar -->
  <rect x="13" y="15" width="38" height="9" rx="4.5" fill="#f59e0b"/>
  <!-- T stem as a road in perspective -->
  <path d="M27 24 H37 L42 51 Q42 53 40 53 H24 Q22 53 22 51 Z" fill="#f59e0b"/>
  <!-- road center dashes -->
  <rect x="31.25" y="27" width="1.5" height="4" rx="0.75" fill="#0f172a"/>
  <rect x="31" y="34" width="2" height="5" rx="1" fill="#0f172a"/>
  <rect x="30.75" y="42" width="2.5" height="7" rx="1.25" fill="#0f172a"/>
  <!-- AI sparkles -->
  <path d="M50 31 L51.4 35.6 L56 37 L51.4 38.4 L50 43 L48.6 38.4 L44 37 L48.6 35.6 Z" fill="#fde68a"/>
  <path d="M14.5 34 L15.2 36.3 L17.5 37 L15.2 37.7 L14.5 40 L13.8 37.7 L11.5 37 L13.8 36.3 Z" fill="#fde68a" opacity="0.8"/>
</svg>
